<title>Navin Sreejith</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#F3F6FB;
    --surface:#FFFFFF;
    --surface-2:#E7EDF7;
    --ink:#131A2A;
    --muted:#57647E;
    --accent:#2955A3;
    --accent-ink:#FFFFFF;
    --accent-2:#0E7C86;
    --line:#D6DEEC;
    --shadow: 0 1px 2px rgba(19,26,42,0.06), 0 8px 24px -12px rgba(19,26,42,0.18);
    --radius: 14px;
    --serif: 'Fraunces', Georgia, 'Times New Roman', serif;
    --sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0D1420;
      --surface:#141D2E;
      --surface-2:#1A2437;
      --ink:#E8ECF6;
      --muted:#93A1BC;
      --accent:#6EA0EA;
      --accent-ink:#08101E;
      --accent-2:#3FC4CC;
      --line:#283350;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 32px -14px rgba(0,0,0,0.55);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0D1420;
    --surface:#141D2E;
    --surface-2:#1A2437;
    --ink:#E8ECF6;
    --muted:#93A1BC;
    --accent:#6EA0EA;
    --accent-ink:#08101E;
    --accent-2:#3FC4CC;
    --line:#283350;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 32px -14px rgba(0,0,0,0.55);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    font-size:16px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    padding-inline:20px;
  }
  a{color:inherit;}
  img{max-width:100%;display:block;}
  h1,h2,h3{font-family:var(--serif);font-weight:700;margin:0;text-wrap:balance;}
  .eyebrow{
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--accent);
    font-weight:500;
  }
  .wrap{max-width:1040px;margin:0 auto;}
  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}

  /* ---- nav ---- */
  header.site{
    position:sticky;
    top:env(safe-area-inset-top,0px);
    z-index:50;
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  nav.wrap{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding-block:14px;
    flex-wrap:wrap;
  }
  .brand{
    font-family:var(--mono);
    font-weight:600;
    font-size:14px;
    letter-spacing:0.02em;
    text-decoration:none;
    display:flex;
    align-items:baseline;
    gap:8px;
    white-space:nowrap;
  }
  .brand .dot{color:var(--accent);}
  .navlinks{
    display:flex;
    gap:4px;
    flex-wrap:wrap;
    font-family:var(--mono);
    font-size:13px;
  }
  .navlinks a{
    text-decoration:none;
    padding:8px 12px;
    border-radius:999px;
    color:var(--muted);
    position:relative;
    transition:color .15s ease, background .15s ease;
  }
  .navlinks a:hover{color:var(--ink); background:var(--surface-2);}
  .navlinks a.active{color:var(--accent-ink); background:var(--accent);}

  /* ---- pages / transitions ---- */
  main{padding-block:48px 96px;}
  .page{animation:rise .38s cubic-bezier(.2,.7,.3,1) both;}
  @media (prefers-reduced-motion: reduce){ .page{animation:none;} }
  @keyframes rise{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }

  section{margin-block:64px;}
  section:first-child{margin-top:0;}

  /* ---- home hero ---- */
  .hero{
    display:grid;
    grid-template-columns:1.3fr 0.9fr;
    gap:48px;
    align-items:center;
  }
  @media (max-width:760px){ .hero{grid-template-columns:1fr; gap:32px;} }
  .hero h1{
    font-size:clamp(2.2rem, 5vw, 3.4rem);
    line-height:1.05;
    margin-top:10px;
  }
  .hero h1 em{
    font-style:italic;
    color:var(--accent);
  }
  .hero p.lede{
    font-size:1.08rem;
    color:var(--muted);
    max-width:52ch;
    margin-top:18px;
  }
  .hero-photo{
    position:relative;
    justify-self:center;
    width:100%;
    max-width:280px;
  }
  .hero-photo img{
    width:100%;
    aspect-ratio:1/1.08;
    object-fit:cover;
    border-radius:20px;
    border:1px solid var(--line);
    box-shadow:var(--shadow);
  }
  .cta-row{display:flex; gap:12px; margin-top:28px; flex-wrap:wrap;}
  .btn{
    font-family:var(--mono);
    font-size:13px;
    text-decoration:none;
    padding:12px 20px;
    border-radius:10px;
    border:1px solid var(--line);
    color:var(--ink);
    transition:transform .15s ease, border-color .15s ease, background .15s ease;
    display:inline-flex;
    align-items:center;
    gap:8px;
  }
  .btn:hover{transform:translateY(-2px); border-color:var(--accent);}
  .btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
  .btn.primary:hover{transform:translateY(-2px) rotate(-0.4deg);}

  /* ---- stat strip ---- */
  .stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
  }
  @media (max-width:700px){ .stats{grid-template-columns:repeat(2,1fr);} }
  .stat{
    padding:22px 16px;
    border-right:1px solid var(--line);
  }
  .stat:last-child{border-right:none;}
  .stat .num{
    font-family:var(--mono);
    font-variant-numeric:tabular-nums;
    font-size:clamp(1.4rem,3vw,2rem);
    font-weight:600;
    color:var(--accent-2);
  }
  .stat .label{
    font-size:12.5px;
    color:var(--muted);
    margin-top:4px;
  }

  /* ---- cards ---- */
  .grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:20px;}
  @media (max-width:800px){ .grid3{grid-template-columns:1fr;} }
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px;
    box-shadow:var(--shadow);
    transition:transform .18s ease;
  }
  .card:hover{transform:translateY(-3px);}
  .card h3{font-size:1.05rem; margin-bottom:8px;}
  .card p{color:var(--muted); font-size:.94rem; margin:0;}

  .section-head{margin-bottom:28px;}
  .section-head h2{font-size:clamp(1.6rem,3vw,2.1rem); margin-top:8px;}
  .section-head p{color:var(--muted); max-width:58ch; margin-top:10px;}

  /* ---- about ---- */
  .bio p{max-width:70ch; color:var(--ink);}
  .bio p + p{margin-top:14px;}
  .skill-groups{display:grid; grid-template-columns:repeat(3,1fr); gap:22px; margin-top:8px;}
  @media (max-width:760px){ .skill-groups{grid-template-columns:1fr;} }
  .skill-group h4{
    font-family:var(--mono);
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--muted);
    margin-bottom:10px;
  }
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    font-size:13px;
    padding:6px 12px;
    border-radius:999px;
    background:var(--surface-2);
    border:1px solid var(--line);
  }
  .cert-row{
    display:flex; flex-wrap:wrap; gap:12px;
    margin-top:10px;
  }
  .cert{
    font-family:var(--mono);
    font-size:12.5px;
    padding:10px 14px;
    border-radius:10px;
    border:1px dashed var(--line);
    color:var(--muted);
  }
  .edu-list{border-top:1px solid var(--line);}
  .edu-item{
    display:grid;
    grid-template-columns:120px 1fr;
    gap:16px;
    padding-block:16px;
    border-bottom:1px solid var(--line);
  }
  @media (max-width:600px){ .edu-item{grid-template-columns:1fr; gap:4px;} }
  .edu-item .yr{font-family:var(--mono); font-size:13px; color:var(--accent-2);}
  .edu-item h4{margin:0 0 3px; font-family:var(--sans); font-weight:600; font-size:1rem;}
  .edu-item span{color:var(--muted); font-size:.9rem;}

  /* ---- experience timeline ---- */
  .timeline{position:relative; padding-left:28px;}
  .timeline::before{
    content:"";
    position:absolute; left:6px; top:6px; bottom:6px;
    width:2px; background:var(--line);
  }
  .tl-item{position:relative; padding-bottom:44px;}
  .tl-item:last-child{padding-bottom:0;}
  .tl-item::before{
    content:"";
    position:absolute; left:-28px; top:4px;
    width:12px; height:12px; border-radius:50%;
    background:var(--accent-2);
    border:3px solid var(--bg);
    box-shadow:0 0 0 1px var(--line);
  }
  .tl-date{font-family:var(--mono); font-size:12.5px; color:var(--muted); letter-spacing:.02em;}
  .tl-item h3{font-size:1.2rem; margin-top:6px;}
  .tl-item .org{color:var(--accent); font-size:.92rem; font-weight:500; margin-top:2px;}
  .tl-item ul{margin:14px 0 0; padding-left:20px; color:var(--ink);}
  .tl-item li{margin-bottom:8px; font-size:.96rem;}
  .tl-item li::marker{color:var(--accent-2);}

  /* ---- work / projects ---- */
  .proj-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:20px;}
  @media (max-width:760px){ .proj-grid{grid-template-columns:1fr;} }
  .proj{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:24px;
    box-shadow:var(--shadow);
  }
  .proj .tag{
    font-family:var(--mono);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--accent-2);
  }
  .proj h3{font-size:1.08rem; margin-top:8px;}
  .proj p{color:var(--muted); font-size:.93rem; margin-top:8px;}

  /* ---- contact ---- */
  .contact-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:20px;
    padding:48px 36px;
    text-align:center;
    box-shadow:var(--shadow);
    max-width:640px;
    margin:0 auto;
  }
  .contact-card h2{font-size:clamp(1.7rem,4vw,2.3rem);}
  .contact-card p{color:var(--muted); max-width:44ch; margin:14px auto 0;}
  .contact-email{
    display:inline-block;
    margin-top:26px;
    font-family:var(--mono);
    font-size:clamp(1.1rem,2.6vw,1.4rem);
    color:var(--accent);
    text-decoration:none;
    border-bottom:2px solid var(--accent);
    padding-bottom:2px;
  }
  .contact-links{display:flex; gap:12px; justify-content:center; margin-top:28px; flex-wrap:wrap;}

  footer{
    border-top:1px solid var(--line);
    padding-block:24px;
    margin-top:40px;
  }
  footer .wrap{
    display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;
    font-family:var(--mono); font-size:12px; color:var(--muted);
  }
</style>

function currentRoute(){
  const hash = location.hash.replace(/^#\/?/, '');
  return hash === '' ? 'home' : hash;
}

function render(){
  const route = currentRoute();
  const fn = routes[route] || routes.home;
  document.getElementById('app').innerHTML = fn();
  document.querySelectorAll('#navlinks a').forEach(a=>{
    a.classList.toggle('active', a.dataset.route === route);
  });
  window.scrollTo({top:0, behavior:'instant' in window ? 'instant' : 'auto'});
}

window.addEventListener('hashchange', render);
render();
